name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check toolchain and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          swift --version
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Test, package, and smoke-test the release archive
        run: ./script/ci.sh
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.arch }}
          path: .local/verify-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish tested archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -f "docs/releases/$RELEASE_TAG.md"
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          sha256sum ./*.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MSI Screen $RELEASE_TAG" \
            --notes-file "../docs/releases/$RELEASE_TAG.md"
