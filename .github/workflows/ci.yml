name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          swift --version
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Test, package, and smoke-test the release archive
        run: ./script/ci.sh
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.arch }}
          path: .local/verify-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Prepare release draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create draft after both architectures pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -f "docs/releases/$RELEASE_TAG.md"
          # Signing credentials stay on the release Mac. CI packages remain
          # workflow artifacts; only notarized assets are attached for publication.
          gh release create "$RELEASE_TAG" --draft \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MSI Screen $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
